name: Build JAT Terminal

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGw toolchain + curl)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl

      - name: Compile Windows (MinGW)
        shell: msys2 {0}
        run: |
          # 컴파일: 7Code.cpp 단일 파일로 빌드
          g++ -std=c++17 -O2 -o jat-terminal.exe 7Code.cpp -lcurl -ladvapi32 -liphlpapi -lws2_32 -lshell32

      - uses: actions/upload-artifact@v4
        with:
          name: jat-terminal-windows
          path: jat-terminal.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: Compile Linux
        run: |
          # 컴파일: 7Code.cpp 단일 파일로 빌드
          g++ -std=c++17 -O2 -o jat-terminal-linux 7Code.cpp -lcurl

      - uses: actions/upload-artifact@v4
        with:
          name: jat-terminal-linux
          path: jat-terminal-linux

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: JAT Terminal - Latest Build
          files: |
            artifacts/jat-terminal-windows/jat-terminal.exe
            artifacts/jat-terminal-linux/jat-terminal-linux
